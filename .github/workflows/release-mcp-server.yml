# Release MCP server to npm
#
# 判据：远程还没有 mcp-server-v{version} 这个 tag 就构建、发布 npm、最后打 tag。
# mcp-server 依赖 core（workspace:^），发布前会先确保 core 已发布
# （按 core-v{version} 判据，未发布则顺带发布 core），并轮询到 core 在 npm 可读。
# web 前端产物在 prepublishOnly 中复制进 dist/web，随包一起发布。
# tag 放在发布成功之后才打，代表「已发布」而不是「试过了」。
#
# Secret: NPM_TOKEN（npm Automation token）
# 版本号在 packages/mcp-server/package.json 中维护。
name: Release MCP server

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decide whether to release mcp-server
        id: gate
        run: |
          PKG="packages/mcp-server/package.json"
          VERSION="$(jq -r .version "$PKG")"
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "::error::无法读取 $PKG 的 version"
            exit 1
          fi
          TAG="mcp-server-v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "${TAG} 已发布过，跳过。要发新版请提高 packages/mcp-server/package.json 的 version。"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "${TAG} 尚未发布，开始构建。"
          fi

      - name: Setup pnpm
        if: steps.gate.outputs.should_release == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Setup Node.js
        if: steps.gate.outputs.should_release == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        if: steps.gate.outputs.should_release == 'true'
        run: pnpm install --frozen-lockfile

      # 全新 checkout 后 core/dist 不存在（被 .gitignore 忽略），
      # 而 mcp-server 通过包名解析 core 的 types/main（exports 指向 dist），
      # 必须先构建 core，否则 typecheck 会报 TS2307 Cannot find module。
      - name: Build core
        if: steps.gate.outputs.should_release == 'true'
        run: pnpm --filter @shaohui_jin/git-cockpit-core run build

      - name: Publish core if not yet released
        if: steps.gate.outputs.should_release == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          CORE_VERSION="$(jq -r .version packages/core/package.json)"
          CORE_TAG="core-v${CORE_VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${CORE_TAG}" >/dev/null 2>&1; then
            echo "${CORE_TAG} 已发布，跳过 core 发布。"
          else
            if [ -z "${NODE_AUTH_TOKEN}" ]; then
              echo "::error::未配置 GitHub Secret NPM_TOKEN"
              exit 1
            fi
            echo "${CORE_TAG} 尚未发布，先发布 core。"
            pnpm --filter @shaohui_jin/git-cockpit-core publish
            # publish 返回即已写入主 registry；立即打 tag 作为「已发布」标记，
            # 这样即使下面的可读性轮询超时，重跑时也会跳过重复 publish（避免 already exists）
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${CORE_TAG}" -m "Release ${CORE_TAG}"
            git push origin "${CORE_TAG}"
          fi
          # 等待 core@{version} 对 registry 可读（防御 npm 发布后的传播延迟）。
          # mcp-server 的发布本身不校验依赖存在，但下游安装时 npm 要解析 core，
          # 不等到它可读就发布 mcp-server，可能造成「装到新包但拉不到 core」。
          echo "等待 @shaohui_jin/git-cockpit-core@${CORE_VERSION} 在 registry 可读..."
          for i in $(seq 1 36); do
            if npm view "@shaohui_jin/git-cockpit-core@${CORE_VERSION}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
              echo "core@${CORE_VERSION} 已可从 registry 解析（第 ${i} 次轮询）"
              break
            fi
            if [ "$i" -eq 36 ]; then
              echo "::error::等待 core@${CORE_VERSION} 可读超时（约 6 分钟）。core/tag 已发布，重跑本 workflow 即可恢复。"
              exit 1
            fi
            sleep 10
          done

      - name: Build web frontend
        if: steps.gate.outputs.should_release == 'true'
        run: pnpm --filter @shaohui_jin/git-cockpit-web build

      - name: Build mcp-server
        if: steps.gate.outputs.should_release == 'true'
        run: pnpm --filter @shaohui_jin/git-cockpit-mcp-server run typecheck && pnpm --filter @shaohui_jin/git-cockpit-mcp-server run build

      - name: Publish mcp-server to npm
        if: steps.gate.outputs.should_release == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        working-directory: packages/mcp-server
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::未配置 GitHub Secret NPM_TOKEN"
            exit 1
          fi
          pnpm publish
          echo "已发布 @shaohui_jin/git-cockpit-mcp-server@${{ steps.gate.outputs.version }}"

      - name: Create and push tag
        if: steps.gate.outputs.should_release == 'true'
        env:
          TAG: ${{ steps.gate.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}"
          echo "已推送 tag ${TAG}"