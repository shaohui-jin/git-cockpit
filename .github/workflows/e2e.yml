# Playwright E2E：测发布形态静态页（packages/e2e）
name: E2E

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
      - main

jobs:
  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core / web / mcp-server
        run: pnpm --filter @shaohui_jin/git-cockpit-core --filter @shaohui_jin/git-cockpit-web --filter @shaohui_jin/git-cockpit-mcp-server build

      - name: Install Playwright Chromium
        run: pnpm --filter @shaohui_jin/git-cockpit-e2e exec playwright install --with-deps chromium

      - name: Run E2E
        env:
          CI: 'true'
          E2E_SKIP_BUILD: '1'
        run: pnpm test:e2e
