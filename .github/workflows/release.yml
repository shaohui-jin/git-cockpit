# Release core & mcp-server to npm (合并版)
#
# 一次推送 / 手动触发即可按顺序发布两个包：
#   1) release-core       —— 判据：远程尚无 core-v{version} 则发布 core 并打 tag
#   2) release-mcp-server —— needs release-core，判据：远程尚无 mcp-server-v{version} 则发布
#      mcp-server 并打 tag。mcp-server 依赖 core，用 needs 保证「core 先发、mcp-server 后发」，
#      无需重复跑 action，也无需在 mcp-server job 内轮询等待 core。
#
# tag 一律在发布成功之后才打，代表「已发布」而非「试过了」，
# 任何一步失败都能原样重试（重新 push 或手动重跑），不浪费版本号。
# Secret: NPM_TOKEN（npm Automation token）
# 版本号分别在 packages/core 与 packages/mcp-server 的 package.json 中维护。
name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  release-core:
    name: Release core
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      core_version: ${{ steps.gate.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decide whether to release core
        id: gate
        run: |
          PKG="packages/core/package.json"
          VERSION="$(jq -r .version "$PKG")"
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "::error::无法读取 $PKG 的 version"
            exit 1
          fi
          TAG="core-v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "${TAG} 已发布过，跳过 core。要发新版请提高 packages/core/package.json 的 version。"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "${TAG} 尚未发布，开始发布 core。"
          fi

      - name: Setup pnpm
        if: steps.gate.outputs.should_release == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Setup Node.js
        if: steps.gate.outputs.should_release == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        if: steps.gate.outputs.should_release == 'true'
        run: pnpm install --frozen-lockfile

      - name: Publish core to npm
        if: steps.gate.outputs.should_release == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        working-directory: packages/core
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::未配置 GitHub Secret NPM_TOKEN"
            exit 1
          fi
          pnpm publish
          echo "已发布 @shaohui_jin/git-cockpit-core@${{ steps.gate.outputs.version }}"

      - name: Create and push core tag
        if: steps.gate.outputs.should_release == 'true'
        env:
          TAG: ${{ steps.gate.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}"
          echo "已推送 tag ${TAG}"

  release-mcp-server:
    name: Release mcp-server
    needs: release-core
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decide whether to release mcp-server
        id: gate
        run: |
          PKG="packages/mcp-server/package.json"
          VERSION="$(jq -r .version "$PKG")"
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "::error::无法读取 $PKG 的 version"
            exit 1
          fi
          TAG="mcp-server-v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "${TAG} 已发布过，跳过 mcp-server。要发新版请提高 packages/mcp-server/package.json 的 version。"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "${TAG} 尚未发布，开始构建 mcp-server。"
          fi

      - name: Setup pnpm
        if: steps.gate.outputs.should_release == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Setup Node.js
        if: steps.gate.outputs.should_release == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        if: steps.gate.outputs.should_release == 'true'
        run: pnpm install --frozen-lockfile

      # 全新 checkout 后 core/dist 不存在（被 .gitignore 忽略），而 mcp-server 通过包名解析
      # core 的 types/main（exports 指向 dist），必须先构建 core，否则 typecheck 会报
      # TS2307 Cannot find module。这里只构建、不发布（发布已由 release-core job 负责）。
      - name: Build core (for typecheck/deps)
        if: steps.gate.outputs.should_release == 'true'
        run: pnpm --filter @shaohui_jin/git-cockpit-core run build

      - name: Build web frontend
        if: steps.gate.outputs.should_release == 'true'
        run: pnpm --filter @shaohui_jin/git-cockpit-web build

      - name: Build mcp-server
        if: steps.gate.outputs.should_release == 'true'
        run: pnpm --filter @shaohui_jin/git-cockpit-mcp-server run typecheck && pnpm --filter @shaohui_jin/git-cockpit-mcp-server run build

      - name: Publish mcp-server to npm
        if: steps.gate.outputs.should_release == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        working-directory: packages/mcp-server
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::未配置 GitHub Secret NPM_TOKEN"
            exit 1
          fi
          pnpm publish
          echo "已发布 @shaohui_jin/git-cockpit-mcp-server@${{ steps.gate.outputs.version }}"

      - name: Create and push mcp-server tag
        if: steps.gate.outputs.should_release == 'true'
        env:
          TAG: ${{ steps.gate.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}"
          echo "已推送 tag ${TAG}"